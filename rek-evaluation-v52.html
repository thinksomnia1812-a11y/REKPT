  // Saved look (palette, layout, dark mode) applied before first paint (no flash).
  (function () { try { var h = document.documentElement, u = JSON.parse(localStorage.getItem("rekev-ui") || "{}"), pal = u.pal === "greek" ? "navygold" : u.pal === "thinksomnia" ? "classic" : (u.pal || "classic");
    h.setAttribute("data-pal", pal); if (u.layout === "gm") h.classList.add("gm"); if (localStorage.getItem("rekev-hdr") === "1") h.classList.add("hdr-min");

</script>
<script>
  // On-device debug console (from rek-tracker): captures console output and errors so problems can be read on a phone.
  (function () {
    const logs = [];
    const str = a => a instanceof Error ? a.name + ": " + a.message : (typeof a === "object" ? (function () { try { return JSON.stringify(a); } catch (e) { return String(a); } })() : String(a));
    const draw = () => { const p = document.getElementById("debugPanel"); if (p) p.textContent = logs.slice(-300).join("\n"); };
    const push = (k, args) => { logs.push("[" + new Date().toLocaleTimeString() + "] [" + k + "] " + Array.from(args).map(str).join(" ")); draw(); };
    ["log", "warn", "error"].forEach(k => { const o = console[k]; console[k] = function () { push(k, arguments); o.apply(console, arguments); }; });
    window.addEventListener("error", e => push("window.onerror", [(e.message || "Script error") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?")]));
    window.addEventListener("unhandledrejection", e => push("unhandledrejection", [e.reason]));
    window.addEventListener("DOMContentLoaded", () => {
      const b = document.getElementById("debugToggleBtn"), p = document.getElementById("debugPanel");
      if (b && p) b.addEventListener("click", () => { p.style.display = p.style.display === "none" ? "block" : "none"; draw(); });
    });
  })();
</script>

function committees() { const l = String((S.settings || {}).committees || "").split(",").map(x => x.trim()).filter(Boolean); return l.length ? l : DEF_COMMITTEES; }

// ---------------- Scoring (pure) ----------------
/** v14 scope model. item.scope = "ALL" | "HR" | "HR,PR,Board" (comma list, committee order) | "INDIVIDUALS" (people only);

const INDIV = "INDIVIDUALS";

 tasks:Object.keys(T).map(id=>{const t=T[id];let d=0,l=0,n=0;of(tr,id).forEach(r=>{if(r.status==="done"||r.doneAt){d++;if(t.deadline&&r.doneAt&&r.doneAt>t.deadline)l++}else if(r.status==="notdone")n++});return{title:t.title,deadline:t.deadline,done:d,late:l,notDone:n}}),
 outs:Object.keys(O).map(id=>{const x=O[id];let a=0,b=0;of(ar,id).forEach(r=>{if(r.attended||Object.values(r.slots||{}).indexOf("P")>=0)a++;else if(r.status==="absent")b++});return{name:x.name,date:x.date,attended:a,absent:b}})}}
function parse(o,file){const D=s=>String(s||"").slice(0,10),out=[];
 if(o.app==="rek-pa-library")return toArr(o.entries);
 if(o.app==="rek-evaluation-event"){const e=o.event||{},p=o.performance||{};out.push(build({kind:"event",evid:e.id,key:"ev|"+e.id+"|"+(p.takenAt||o.exportedAt),name:(e.name||"Event")+" · "+D(e.end||p.takenAt),date:D(e.end||p.takenAt||o.exportedAt),file,mr:p.memberRows,cr:p.commRows,team:p.team,ev:evStats(o)}));Object.keys(o.checkpoints||{}).forEach(k=>{const c=o.checkpoints[k]||{};if(c.memberRows&&c.commRows)out.push(build({kind:"snapshot",key:"cp|"+k,name:(c.name||"Checkpoint")+" · "+(e.name||"Event"),date:D(c.date),file,mr:c.memberRows,cr:c.commRows,team:c.team}))})}
 else if(o.app==="rek-evaluation"){const ev=o.seasonEvents||{};Object.keys(o.checkpoints||{}).forEach(k=>{const c=o.checkpoints[k];out.push(build({kind:"snapshot",key:"cp|"+k,name:(c.name||"Checkpoint")+((ev[c.seasonEvent]||{}).name?" · "+ev[c.seasonEvent].name:""),date:D(c.date),file,mr:c.memberRows,cr:c.commRows,team:c.team}))});
  Object.keys(o.archives||{}).forEach(k=>{const a=o.archives[k];out.push(build({kind:"archive",key:"ar|"+k,name:a.termName||"Season",date:D(a.closedAt),file,mr:a.memberRows,cr:a.commRows,team:a.team}))})}
 else if(o.memberRows&&o.commRows)out.push(build({kind:"snapshot",key:"sn|"+(o.date||o.takenAt||Date.now())+"|"+toArr(o.memberRows).length,name:o.name||(file||"Snapshot").replace(/\.json$/i,""),date:D(o.date||o.takenAt||o.exportedAt),file,mr:o.memberRows,cr:o.commRows,team:o.team}));
 return out}
async function importFiles(fl){let add=0,skip=0,bad=[];
 for(const f of fl){try{const es=parse(JSON.parse(await f.text()),f.name);if(!es.length)bad.push(f.name);es.forEach(e=>{if(LIB.some(x=>x.key===e.key||(e.evid&&x.evid===e.evid))){skip++;return}if(LIB.some(x=>x.id===e.id))e.id+=Math.random().toString(36).slice(2,5);e.file=e.file||f.name;LIB.push(e);put(e);add++;UI.sel=e.id})}catch(x){bad.push(f.name)}}
 note((add?"Imported "+add+". ":"")+(skip?skip+" already in history. ":"")+(bad.length?"Not recognised: "+bad.join(", "):""));render()}

function chart(series,labels,pct){const W=760,H=300,L=44,R=14,T=14,B=78,all=series.flatMap(s=>s.v).filter(v=>v!=null);
 if(!all.length)return'<p class="meta">No data for this metric yet.</p>';
 let lo=pct?0:Math.min(0,...all),hi=pct?100:Math.max(...all,1)*1.1;if(!pct&&hi===lo)hi=lo+1;const n=labels.length,X=i=>n>1?L+i*(W-L-R)/(n-1):(L+W-R)/2,Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmt(v,pct?0:1)+'</text>'}
 labels.forEach((l,i)=>{s+='<text transform="translate('+X(i)+','+(H-B+14)+') rotate(-30)" text-anchor="end">'+esc(l.length>22?l.slice(0,21)+"…":l)+'</text>'});
 series.forEach(se=>{let d="",pen=false;se.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i)+" "+Y(v);pen=true});
  s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2.4"/>';se.v.forEach((v,i)=>{if(v!=null)s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="'+se.color+'"><title>'+esc(se.name)+" — "+esc(labels[i])+": "+fmt(v,2)+(pct?"%":"")+'</title></circle>'})});
 return s+"</svg>"}
const slope=a=>{const p=a.map((v,i)=>[i,v]).filter(x=>x[1]!=null);if(p.length<2)return null;const mx=mean(p.map(x=>x[0])),my=mean(p.map(x=>x[1]));let nu=0,de=0;p.forEach(x=>{nu+=(x[0]-mx)*(x[1]-my);de+=(x[0]-mx)**2});return de?nu/de:0};
const trend=s=>s==null?"—":s>1?'<span class="up">▲ Improving</span>':s<-1?'<span class="dn">▼ Declining</span>':"● Stable";
const dlt=(a,b)=>a==null||b==null?"—":'<span class="'+(a-b>=0?"up":"dn")+'">'+(a-b>=0?"+":"")+fmt(a-b)+"</span>";
