<script>
  // On-device debug console (from rek-tracker): captures console output and errors so problems can be read on a phone.
  (function () {
    const logs = [];
    const str = a => a instanceof Error ? a.name + ": " + a.message : (typeof a === "object" ? (function () { try { return JSON.stringify(a); } catch (e) { return String(a); } })() : String(a));
    const draw = () => { const p = document.getElementById("debugPanel"); if (p) p.textContent = logs.slice(-300).join("\n"); };
    const push = (k, args) => { logs.push("[" + new Date().toLocaleTimeString() + "] [" + k + "] " + Array.from(args).map(str).join(" ")); draw(); };
    ["log", "warn", "error"].forEach(k => { const o = console[k]; console[k] = function () { push(k, arguments); o.apply(console, arguments); }; });
    window.addEventListener("error", e => push("window.onerror", [(e.message || "Script error") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?")]));
    window.addEventListener("unhandledrejection", e => push("unhandledrejection", [e.reason]));
    window.addEventListener("DOMContentLoaded", () => {
      const b = document.getElementById("debugToggleBtn"), p = document.getElementById("debugPanel");
      if (b && p) b.addEventListener("click", () => { p.style.display = p.style.display === "none" ? "block" : "none"; draw(); });
    });
  })();
</script>

  /* ================= v38: calm tokens, flat nav, tactile data ================= */
  :root { --err:#B42318; --adj-ink:#8A5A1E; --adj-bg:#F8EFDD; --adj-line:#E6D3AE; --lift: 0 6px 18px rgba(23,33,58,.10); }
  html.dark { --err:#F59A92; --adj-ink:#E6C48A; --adj-bg:rgba(230,196,138,.12); --adj-line:rgba(230,196,138,.28); --lift: 0 8px 22px rgba(0,0,0,.35); }
  .neg { color: var(--bad); font-weight: 600; } .link.red { color: var(--bad); }
  .btn.danger:hover { color: #fff; }
  .care { margin: -2px 0 12px; font-size: 13px; line-height: 1.5; color: var(--mut); }
  .care-note { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; padding: 12px 16px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); color: var(--mut); font-size: 13px; line-height: 1.5; }

  /* flat two-row navigation: groups on top, their panels directly beneath, always visible */
  html:not(.gm) .subtab { color: color-mix(in srgb, var(--htext, #fff) 72%, transparent); min-height: 32px; padding: 4px 14px; font-size: 13px; transition: background .15s, color .15s; }
  html:not(.gm) .subtab:hover:not(.on) { color: var(--htext, #fff); background: rgba(255,255,255,.1); }
  html:not(.gm) .subtab.on { color: var(--htext, #fff); background: rgba(255,255,255,.16); box-shadow: inset 0 -2px 0 var(--gold, var(--acc)); }
  html:not(.gm) .subhint { color: color-mix(in srgb, var(--htext, #fff) 55%, transparent); }
  /* breathing room */
  main.wrap { padding-top: 40px; } .card { padding: 22px 24px; margin-bottom: 22px; border-radius: 20px; } .kpis { gap: 16px; margin-bottom: 22px; } .kpi { padding: 16px 18px; border-radius: 18px; }
  .row { margin-bottom: 18px; } h3 { margin-bottom: 12px; } .dash { gap: 22px; }
  th { padding: 12px 14px; } td { padding: 13px 14px; } .tbl-wrap { border-radius: 12px; }
  .list-item { padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; }
  /* hover elevation: cards lift, rows glow softly */
  .card, .kpi, .list-item { transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease, background-color .2s ease; }
  .card:hover, .kpi:hover { box-shadow: var(--lift); border-color: color-mix(in srgb, var(--acc) 22%, var(--line)); }
  .kpi:hover { transform: translateY(-2px); } .list-item:hover:not(.on) { transform: translateY(-1px); box-shadow: var(--lift); border-color: color-mix(in srgb, var(--acc) 30%, var(--line)); }
  tbody tr { transition: background-color .15s ease, box-shadow .15s ease; }
  tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); box-shadow: inset 3px 0 0 color-mix(in srgb, var(--acc) 55%, transparent); }
  html[dir="rtl"] tbody tr:hover { box-shadow: inset -3px 0 0 color-mix(in srgb, var(--acc) 55%, transparent); }
  .att-sheet tbody tr:hover td:first-child { background: color-mix(in srgb, var(--acc) 7%, var(--card)); }
  tbody tr:last-child td { border-bottom: 0; } tfoot tr:hover, thead tr:hover { background: transparent; box-shadow: none; }
  .cal-cell.add { transition: background-color .15s; } .tl-blk, .cal-ev { transition: filter .15s, box-shadow .15s; } .tl-blk:hover, .cal-ev:hover { filter: brightness(.97); }
  /* Rules: one card at a time */
  .rule-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; } .rule-card { max-width: 860px; }
  .rule-card .cellin { width: 84px; }
  @media (prefers-reduced-motion: reduce) { .card, .kpi, .list-item, tbody tr { transition: none; } .kpi:hover, .list-item:hover:not(.on) { transform: none; } }
  @media (max-width: 640px) { .card { padding: 16px; } main.wrap { padding-top: 24px; } }
  html.gm .card:hover, html.gm .kpi:hover { box-shadow: 4px 4px 0 0 var(--pix); transform: none; } html.gm tbody tr:hover { box-shadow: none; }

  /* ================= v40: Thinksomnia header (brand | main tabs | status + menu); sub-panels live in the page ================= */

  html body .subbar .subtab { border: 1px solid var(--line); background: transparent; color: var(--mut); border-radius: 999px; padding: 6px 16px; min-height: 34px; font-size: 13px; font-weight: 600; box-shadow: none !important; transition: background .15s, color .15s, border-color .15s; }
